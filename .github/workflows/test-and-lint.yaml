name: Test and lint

on: [push]

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with: { require-lockfile: true, cache: true }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test -- --coverage --silent
      - run: pnpm run lint
